<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111817">
  <meta name="description" content="A wordless, continuous visual journey through Bitcoin. Scroll to set it in motion.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Bitcoin, in motion</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./src/style.css">
  <script src="./vendor/anime.umd.min.js" defer></script>
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <main id="journey" class="journey" aria-label="Bitcoin, in motion. Scroll down to advance the visual story; scroll up to rewind.">
    <div class="stage">
      <div id="world" class="world">
        <svg id="fallback" class="fallback" viewBox="0 0 1000 800" role="img" aria-labelledby="fallback-title fallback-description">
          <title id="fallback-title">A payment becomes part of a shared chain</title>
          <desc id="fallback-description">Enable JavaScript, then scroll to follow the animation.</desc>
          <g fill="none" stroke="#d0f58b" stroke-width="2">
            <path opacity=".2" d="m250 270 250-140 250 140v260L500 670 250 530Zm0 0 250 140 250-140M500 410v260"/>
            <path d="m390 350 110-63 110 63v126l-110 63-110-63Zm0 0 110 63 110-63M500 413v126"/>
            <circle cx="500" cy="405" r="35" fill="#111817" stroke="#f3a575"/>
            <path stroke="#f3a575" d="M489 387v37m10-43v48m-16-38h21c15 0 15 14 0 14h-21m6 0h16c17 0 17 15 0 15h-22"/>
          </g>
        </svg>
      </div>
      <svg id="scroll-cue" class="scroll-cue" viewBox="0 0 32 48" aria-hidden="true"><path d="M16 3v33m-8-8 8 8 8-8"/></svg>
      <div class="reading-progress" aria-hidden="true"><span id="reading-progress"></span></div>
    </div>
    <p id="accessible-state" class="sr-only" aria-live="off">Scroll to follow a payment from its owner into a shared chain.</p>
  </main>
</body>
</html>
